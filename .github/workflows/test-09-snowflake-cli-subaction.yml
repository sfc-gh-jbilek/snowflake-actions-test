name: "test-09 snowflake-cli sub-action"
on:
  push:
  workflow_call:
jobs:
  basic-install:
    name: basic install
    runs-on: ubuntu-latest
    steps:
      - uses: snowflakedb/snowflake-actions/snowflake-cli@feat/modular-install-cli-cortex
      - run: snow --version

  cli-version:
    name: cli-version input
    runs-on: ubuntu-latest
    steps:
      - id: latest
        run: |
          VERSION=$(curl -s https://pypi.org/pypi/snowflake-cli/json | jq -r '.info.version')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - uses: snowflakedb/snowflake-actions/snowflake-cli@feat/modular-install-cli-cortex
        with:
          cli-version: ${{ steps.latest.outputs.version }}
      - run: snow --version | grep "${{ steps.latest.outputs.version }}"

  mutual-exclusion:
    name: mutual exclusion error
    runs-on: ubuntu-latest
    steps:
      - id: check
        continue-on-error: true
        uses: snowflakedb/snowflake-actions/snowflake-cli@feat/modular-install-cli-cortex
        with:
          cli-version: "3.19.0"
          custom-github-ref: "main"
      - name: Assert action failed (mutual exclusion enforced)
        run: |
          if [ "${{ steps.check.outcome }}" != "failure" ]; then
            echo "Expected failure due to mutual exclusion, but outcome was: ${{ steps.check.outcome }}"
            exit 1
          fi
          echo "OK: sub-action correctly rejected both inputs"
