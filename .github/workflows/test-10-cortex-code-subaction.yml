name: "test-10 cortex-code sub-action"
on:
  push:
  workflow_call:
jobs:
  install-only:
    name: install only (no connection)
    runs-on: ubuntu-latest
    steps:
      - uses: snowflakedb/snowflake-actions/cortex-code@feat/modular-install-cli-cortex
      - run: cortex --version

  beta-channel:
    name: beta channel install
    runs-on: ubuntu-latest
    steps:
      - uses: snowflakedb/snowflake-actions/cortex-code@feat/modular-install-cli-cortex
        with:
          cli-channel: "beta"
      - run: cortex --version

  invalid-channel:
    name: invalid channel is rejected
    runs-on: ubuntu-latest
    steps:
      - id: check
        continue-on-error: true
        uses: snowflakedb/snowflake-actions/cortex-code@feat/modular-install-cli-cortex
        with:
          cli-channel: "nightly"
      - name: Assert action failed (invalid channel rejected)
        run: |
          if [ "${{ steps.check.outcome }}" != "failure" ]; then
            echo "Expected failure for invalid channel, but outcome was: ${{ steps.check.outcome }}"
            exit 1
          fi
          echo "OK: sub-action correctly rejected invalid channel"
