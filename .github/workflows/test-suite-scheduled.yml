name: "test-suite (weekly)"
on:
  schedule:
    - cron: '0 9 * * 1'  # Every Monday 09:00 UTC
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test-01-basic-install:
    name: "01 basic install"
    runs-on: ubuntu-latest
    steps:
      - uses: snowflakedb/snowflake-actions@main
      - run: snow --version

  test-02-cli-version:
    name: "02 cli-version input"
    runs-on: ubuntu-latest
    steps:
      - uses: snowflakedb/snowflake-actions@main
        with:
          cli-version: "3.19.0"
      - run: snow --version | grep "3.19.0"

  test-03-custom-github-ref:
    name: "03 custom-github-ref"
    runs-on: ubuntu-latest
    steps:
      - uses: snowflakedb/snowflake-actions@main
        with:
          custom-github-ref: "main"
      - run: snow --version

  test-04-mutual-exclusion:
    name: "04 mutual exclusion error"
    runs-on: ubuntu-latest
    steps:
      - id: mutual-exclusion
        continue-on-error: true
        uses: snowflakedb/snowflake-actions@main
        with:
          cli-version: "3.19.0"
          custom-github-ref: "main"
      - name: Assert action failed (mutual exclusion enforced)
        run: |
          if [ "${{ steps.mutual-exclusion.outcome }}" != "failure" ]; then
            echo "Expected failure due to mutual exclusion, but outcome was: ${{ steps.mutual-exclusion.outcome }}"
            exit 1
          fi
          echo "OK: action correctly rejected both inputs"

  test-05-oidc:
    name: "05 OIDC auth"
    runs-on: ubuntu-latest
    steps:
      - uses: snowflakedb/snowflake-actions@main
        with:
          use-oidc: "true"
      - env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
        run: snow connection test -x

  test-06-keypair-temp:
    name: "06 key pair temporary connection"
    runs-on: ubuntu-latest
    steps:
      - uses: snowflakedb/snowflake-actions@main
      - env:
          SNOWFLAKE_AUTHENTICATOR: SNOWFLAKE_JWT
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER_KP }}
          SNOWFLAKE_PRIVATE_KEY_RAW: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_RAW }}
        run: snow connection test -x

  test-07-keypair-named:
    name: "07 key pair named connection"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: snowflakedb/snowflake-actions@main
        with:
          default-config-file-path: "config.toml"
      - env:
          SNOWFLAKE_CONNECTIONS_MYCONNECTION_AUTHENTICATOR: SNOWFLAKE_JWT
          SNOWFLAKE_CONNECTIONS_MYCONNECTION_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_CONNECTIONS_MYCONNECTION_USER: ${{ secrets.SNOWFLAKE_USER_KP }}
          SNOWFLAKE_CONNECTIONS_MYCONNECTION_PRIVATE_KEY_RAW: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_RAW }}
        run: snow connection test

  test-08-config-absent:
    name: "08 config absent silent skip"
    runs-on: ubuntu-latest
    steps:
      - uses: snowflakedb/snowflake-actions@main
      - run: snow --version
