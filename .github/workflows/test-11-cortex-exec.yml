name: "test-11 cortex exec (OIDC + prompt)"
on:
  push:
  workflow_call:
permissions:
  id-token: write
  contents: read
jobs:
  exec:
    name: cortex exec with a prompt
    runs-on: ubuntu-latest
    steps:
      - uses: snowflakedb/snowflake-actions/cortex-code@feat/modular-install-cli-cortex
        with:
          use-oidc: "true"
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT_CORTEX }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER_CORTEX }}
      - name: Run a prompt and verify response
        run: |
          OUTPUT=$(cortex exec -c default --format json --max-turns 2 --bypass \
            "Run this SQL and tell me the result: SELECT CURRENT_USER() AS WHO")
          echo "$OUTPUT"
          [[ -n "$OUTPUT" ]] || { echo "::error::Empty response from cortex exec"; exit 1; }
          echo "PASS: cortex exec returned a response"
